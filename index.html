<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HCA Chat Assistant</title>
    
    <!-- We use the Dialogflow CX Messenger script because it connects to your Vertex AI Agent without needing GCP Admin roles -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger-cx/bootstrap.js?v=1"></script>
    
    <style>
        /* This CSS forces the messenger to take up 100% of the screen on desktop, mobile, and tablets */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212; /* Dark theme background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        df-messenger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 999999;
            
            /* Customizing styling variables to match your dark theme */
            --df-messenger-font-color: #ffffff;
            --df-messenger-chat-background-color: #121212;
            --df-messenger-message-user-background-color: #0b57d0;
            --df-messenger-message-bot-background-color: #303030;
        }
    </style>
</head>
<body>

    <!-- DIALOGFLOW CX MESSENGER COMPONENT (Mapped to your Vertex AI Agent Details) -->
    <df-messenger
      project-id="hca-bpg-ccai-cai-dev"
      agent-id="1d07ef1f-a32b-4eaa-a61a-81f106c224be"
      location-id="us"
      language-code="en"
      chat-title="HCA Chat Assistant">
    </df-messenger>

</body>
</html>
