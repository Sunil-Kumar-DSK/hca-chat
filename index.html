<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HCA Chat Assistant</title>
    
    <!-- VERTEX AI HEAD SECTION SCRIPTS -->
    <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">
    
    <style>
        /* Custom Styles to make the assistant full-screen on mobile, tablet, and desktop */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212; /* Matches your dark theme */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        chat-messenger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            --chat-messenger-width: 100%;
            --chat-messenger-height: 100%;
            z-index: 999999;
        }

        chat-messenger-container {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <!-- VERTEX AI BODY SECTION SCRIPTS -->
    <script>
      window.addEventListener("chat-messenger-loaded", () => {
        chatSdk.registerContext(
          chatSdk.prebuilts.ces.createContext({
            deploymentName: "projects/810617531031/locations/us/apps/1d07ef1f-a32b-4eaa-a61a-81f106c224be/deployments/ca76b6ba-4d4e-44cc-b2e6-f0b68cd51518",
            tokenBroker: {
              enableTokenBroker: false,  /* CHANGED TO FALSE FOR PUBLIC ACCESS */
              enableRecaptcha: false
            }
          }),
        );
      });
    </script>

    <!-- VERTEX AI CHAT MESSENGER CUSTOM TAG -->
    <chat-messenger
      url-allowlist="*"
      color-scheme="dark"
    >
      <chat-messenger-container
        chat-title="HCA Chat Assistant"
        chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
        enable-file-upload
        enable-audio-input
      >
        <chat-reset-session-button
          slot="titlebar-actions"
          title-text="Start new chat"
        ></chat-reset-session-button>
        <chat-toggle-dialog-button
          slot="titlebar-actions"
          title-text-expanded="Collapse"
          title-text-collapsed="Expand"
        ></chat-toggle-dialog-button>
        <chat-messenger-close-button
          slot="titlebar-actions"
          title-text="Close"
        ></chat-messenger-close-button>
      </chat-messenger-container>
    </chat-messenger>

</body>
</html>
